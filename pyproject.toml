[project]
name = "sc-dataset-agent"
version = "0.1.0"
description = "Agent that finds public scRNA-seq datasets from plain-language requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
